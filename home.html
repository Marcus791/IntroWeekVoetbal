<!DOCTYPE html>
<html lang="nl">
<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Football - Home</title>

    <link rel="stylesheet" href="style.css">
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""
    >

</head>

<body class="home-page">

    <header class="header">

        <a href="index.html" class="logo">
            <img src="logo.png" alt="Logo">
        </a>

        <nav>

            <a href="home.html" class="active">
                Home
            </a>

            <a href="#">
                Teams
            </a>

            <a href="#">
                Wedstrijden
            </a>

            <a href="#">
                Nieuws
            </a>

        </nav>

    </header>


    <main class="main">

        <section class="home-dashboard">

            <div class="dashboard-copy">

                <p class="eyebrow">Plan je voetbalmoment</p>

                <h1>Welkom!</h1>

                <p class="subtitle">
                    Kies een dag en uur en bekijk direct de kaart van Nederland.
                </p>

                <div class="control-grid">
                    <div class="control-card">
                        <label for="day-select">Dagen</label>
                        <select id="day-select" name="day">
                            <option value="maandag">Maandag</option>
                            <option value="dinsdag">Dinsdag</option>
                            <option value="woensdag">Woensdag</option>
                            <option value="donderdag">Donderdag</option>
                            <option value="vrijdag">Vrijdag</option>
                            <option value="zaterdag">Zaterdag</option>
                            <option value="zondag">Zondag</option>
                        </select>
                    </div>

                    <div class="control-card">
                        <label for="stadium-select">Stadions Rotterdam</label>
                        <select id="stadium-select" name="stadium">
                            <option value="de-kuip">De Kuip</option>
                            <option value="het-kasteel">Het Kasteel</option>
                            <option value="varkenoord">Sportcomplex Varkenoord</option>
                        </select>
                    </div>

                    <div class="control-card">
                        <label for="time-select">Uren</label>
                        <select id="time-select" name="time">
                            <option value="08:00">08:00</option>
                            <option value="09:00">09:00</option>
                            <option value="10:00">10:00</option>
                            <option value="11:00">11:00</option>
                            <option value="12:00">12:00</option>
                            <option value="13:00">13:00</option>
                            <option value="14:00">14:00</option>
                            <option value="15:00">15:00</option>
                            <option value="16:00">16:00</option>
                            <option value="17:00">17:00</option>
                            <option value="18:00">18:00</option>
                            <option value="19:00">19:00</option>
                            <option value="20:00">20:00</option>
                            <option value="21:00">21:00</option>
                            <option value="22:00">22:00</option>
                        </select>
                    </div>
                </div>

                <button type="button" class="primary-action">Bekijk planning</button>
            </div>

            <div class="map-panel">
                <div id="netherlands-map" aria-label="Kaart van Nederland"></div>
            </div>

        </section>

    </main>

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""
    ></script>
    <script>
        const stadiums = {
            'de-kuip': {
                name: 'De Kuip',
                location: [51.8936, 4.5239],
                zoom: 15
            },
            'het-kasteel': {
                name: 'Het Kasteel',
                location: [51.9198, 4.4328],
                zoom: 15
            },
            'varkenoord': {
                name: 'Sportcomplex Varkenoord',
                location: [51.8886, 4.5061],
                zoom: 15
            }
        };

        const map = L.map('netherlands-map', {
            zoomControl: true,
            scrollWheelZoom: false
        }).setView(stadiums['de-kuip'].location, 11);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        const stadiumMarker = L.marker(stadiums['de-kuip'].location)
            .addTo(map)
            .bindPopup(stadiums['de-kuip'].name)
            .openPopup();

        const stadiumSelect = document.getElementById('stadium-select');

        stadiumSelect.addEventListener('change', (event) => {
            const stadium = stadiums[event.target.value];

            if (!stadium) {
                return;
            }

            map.setView(stadium.location, stadium.zoom);
            stadiumMarker.setLatLng(stadium.location);
            stadiumMarker.setPopupContent(stadium.name).openPopup();
        });
    </script>

</body>
</html>
