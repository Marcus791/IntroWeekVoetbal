<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Football - Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header class="header">

        <!-- LOGO -->
        <a href="index.html" class="logo">
            <img src="logo.png" alt="Logo">
        </a>

        <!-- NAVIGATIE -->
        <nav>
            <a href="index.html" class="active">Home</a>
            <a href="#">Teams</a>
            <a href="#">Wedstrijden</a>
            <a href="#">Nieuws</a>
        </nav>

    </header>


    <!-- LOGIN -->
    <main class="main">

        <div class="login-box">

            <h1>Log in om verder te gaan</h1>

            <p class="subtitle">
                
            </p>


            <form action="home.html">

                <!-- EMAIL -->
                <div class="input-group">

                    <label for="email">
                        Email / ID
                    </label>

                    <input
                        type="text"
                        id="email"
                        name="email"
                        placeholder="Vul je email of ID in"
                        required
                    >

                </div>


                <!-- WACHTWOORD -->
                <div class="input-group">

                    <label for="password">
                        Wachtwoord
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Vul je wachtwoord in"
                        required
                    >

                </div>


                <!-- LOGIN BUTTON -->
                <button type="submit">
                    Log in
                </button>

            </form>


            <p class="register">
                Nog geen account?
                <a href="#">Account aanmaken</a>
            </p>

        </div>

    </main>

</body>
</html>
